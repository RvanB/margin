<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Margins</title>
  <link rel="stylesheet" href="margins.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>

<div id="top-bar">
  <div id="top-bar-title">MARGINS</div>
  <div id="top-bar-main">
    <div id="menu-bar">
    <details class="menu-dropdown">
      <summary>File</summary>
      <div class="menu-panel">
        <label id="load-content-btn" class="menu-action menu-file-action">
          <span>Load content</span>
          <input id="content-file-input" type="file" accept="image/*,.pdf,application/pdf,.zip,application/zip,application/x-zip-compressed" multiple>
        </label>
        <button id="export-pages-btn" type="button" class="menu-action">Export</button>
        <button id="save-project-btn" type="button" class="menu-action">Save settings</button>
        <label id="load-project-btn" class="menu-action menu-file-action">
          <span>Load settings</span>
          <input id="project-file-input" type="file" accept=".json,application/json">
        </label>
      </div>
    </details>
    <details class="menu-dropdown">
      <summary>Mode</summary>
      <div class="menu-panel">
        <button type="button" class="menu-action mode-menu-item active" data-mode="layout">Layout</button>
        <button type="button" class="menu-action mode-menu-item" data-mode="content">Content</button>
      </div>
    </details>
    <details class="menu-dropdown">
      <summary>View</summary>
      <div class="menu-panel">
        <label class="menu-check">
          <input type="checkbox" id="show-layout-content" checked>
          <span>Show content</span>
        </label>
        <label class="menu-check">
          <input type="checkbox" id="show-margin-arrows">
          <span>Show margin arrows</span>
        </label>
        <label class="menu-check">
          <input type="checkbox" id="show-center-line" checked>
          <span>Show center line</span>
        </label>
        <label class="menu-check">
          <input type="checkbox" id="vdg">
          <span>van de Graaf</span>
        </label>
        <details class="menu-submenu">
          <summary class="menu-submenu-trigger">Paper</summary>
          <div class="menu-submenu-panel">
            <details class="menu-submenu">
              <summary class="menu-submenu-trigger">Color</summary>
              <div class="menu-submenu-panel">
                <div id="paper-color-list" class="menu-list"></div>
              </div>
            </details>
          </div>
        </details>
      </div>
    </details>
    </div>
    <div id="export-status" aria-live="polite" hidden>
      <div id="export-status-text"></div>
      <div id="export-progress"><div id="export-progress-fill"></div></div>
    </div>
  </div>
</div>

<div id="app-shell">
  <div id="sidebar">
    <div id="toolbar"><!-- populated by JS --></div>
  </div>

  <div id="canvas-wrap">
    <div id="canvas-area">
      <div id="canvas-area-inner">
        <div id="canvas-stage">
          <canvas id="spread-canvas"></canvas>
          <canvas id="overlay-canvas"></canvas>
        </div>
      </div>
    </div>
    <div id="canvas-controls">
      <div id="canvas-zoom-controls" aria-label="Canvas zoom">
        <button id="canvas-zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="canvas-zoom-out" type="button" aria-label="Zoom out">-</button>
      </div>
    </div>
    <div id="page-strip"></div>
  </div>
</div>

<div id="busy-overlay" hidden aria-hidden="true">Exporting…</div>
<dialog id="app-modal" class="app-modal"></dialog>

<!-- ── Toolbar templates ───────────────────────────────────────────────────── -->

<template id="tpl-modal-shell">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title"></div>
      <button type="button" class="modal-close-btn" data-modal-close>Close</button>
    </div>
    <div class="modal-content"></div>
  </div>
</template>

<template id="tpl-export-modal">
  <form id="export-modal-form" class="modal-form">
    <div class="modal-section">
      <div class="modal-section-label">Resolution</div>
      <label class="modal-check">
        <input type="radio" name="export-resolution-mode" value="source">
        <span>Source resolution</span>
      </label>
      <label class="modal-check">
        <input type="radio" name="export-resolution-mode" value="custom">
        <span>Target DPI</span>
      </label>
      <div class="modal-inline-field">
        <label for="export-dpi">DPI</label>
        <input id="export-dpi" type="number" min="1" step="1" inputmode="numeric">
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">Statistics</div>
      <div class="modal-stat-row"><span>Lowest source DPI</span><span id="export-lowest-dpi">Calculating…</span></div>
      <div class="modal-stat-row"><span>Highest source DPI</span><span id="export-highest-dpi">Calculating…</span></div>
    </div>

    <div class="modal-section">
      <label class="modal-check">
        <input id="export-include-page-color" type="checkbox" checked>
        <span>Include page color</span>
      </label>
    </div>

    <div class="modal-actions">
      <button type="button" class="modal-action-btn" data-modal-close>Cancel</button>
      <button id="confirm-export-btn" type="submit" class="modal-action-btn">Export</button>
    </div>
  </form>
</template>

<template id="tpl-layout">
  <div class="section">
    <div class="section-label">Page (inches)</div>
    <div class="dim-row">
      <label>width</label>
      <input type="number" id="pw" step="0.01" min="1" max="20" value="5.5">
      <span class="unit">in</span>
    </div>
    <div class="dim-row">
      <label>height</label>
      <input type="number" id="ph" step="0.01" min="1" max="30" value="8.5">
      <span class="unit">in</span>
    </div>
    <div class="dim-row" style="margin-top:4px">
      <label>ratio</label>
      <input type="number" id="page-ratio" step="0.001" min="0.1" max="2" value="0.647">
    </div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:4px">
      <input type="checkbox" id="preserve-ratio">
      <span style="font-size:11px">Preserve ratio</span>
    </label>
  </div>

  <div class="section">
    <div class="section-label">Text block ratio (w/h)</div>
    <div class="dim-row">
      <input type="number" id="ratio" step="0.001" min="0.1" max="2" value="0.543">
    </div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:4px">
      <input type="checkbox" id="ratio-same-as-page">
      <span style="font-size:11px">Same as page</span>
    </label>
  </div>

  <div class="section">
    <div class="section-label">Back margin</div>
    <div id="slider-header">
      <span>b</span>
      <span id="b-val">0.75 in</span>
    </div>
    <input type="range" id="b-slider" min="0.1" max="1.5" step="0.01" value="0.75">
    <div class="slider-ends"><span>0.1</span><span>1.5</span></div>
  </div>

  <div class="section">
    <div class="section-label">Proportions (× b)</div>
    <div class="dim-row">
      <label>inner</label>
      <input type="number" id="m-inner" step="0.05" min="0.1" value="1">
    </div>
    <div class="dim-row">
      <label>top</label>
      <input type="number" id="m-top" step="0.05" min="0.1" value="1.5">
    </div>
    <div class="dim-row">
      <label>bottom</label>
      <input type="number" id="m-bottom" step="0.05" min="0.1" value="2.5">
    </div>
  </div>

  <div class="section">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="section-label" style="margin:0">van de Graaf</div>
      <button id="vdg-snap" style="font-family:inherit;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;background:none;border:1px solid #000;padding:2px 6px;cursor:pointer">Apply</button>
    </div>
  </div>

  <div class="section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div class="section-label" style="margin:0">Computed</div>
      <button id="print-btn" style="font-family:inherit;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;background:none;border:none;cursor:pointer;padding:0">Print</button>
    </div>
    <div class="computed-row"><span>inner</span><span id="c-inner">—</span></div>
    <div class="computed-row"><span>top</span><span id="c-top">—</span></div>
    <div class="computed-row"><span>outer</span><span id="c-outer">—</span></div>
    <div class="computed-row"><span>bottom</span><span id="c-bottom">—</span></div>
    <div class="computed-row"><span>tb width</span><span id="c-tw">—</span></div>
    <div class="computed-row"><span>tb height</span><span id="c-th">—</span></div>
  </div>

</template>

<template id="tpl-content">

  <div class="section" id="toolbar" style="display:none">
    <label class="content-toggle">
      <input type="checkbox" id="cover-check">
      <span style="font-size:11px">Cover / full bleed</span>
    </label>
    <label class="content-toggle" style="margin-top:8px">
      <input type="checkbox" id="spread-check">
      <span style="font-size:11px">Spread / inner 0</span>
    </label>
    <div class="section" style="margin-top:16px">
      <div class="section-label">Alignment</div>
      <div class="dim-row">
        <label>horizontal</label>
        <select id="content-align-x">
          <option value=""></option>
          <option value="left">left</option>
          <option value="center">center</option>
          <option value="right">right</option>
        </select>
      </div>
      <div class="dim-row" style="margin-top:8px">
        <label>vertical</label>
        <select id="content-align-y">
          <option value=""></option>
          <option value="top">top</option>
          <option value="center">center</option>
          <option value="bottom">bottom</option>
        </select>
      </div>
    </div>
  </div>


</template>

<script type="module" src="src/main.js"></script>
</body>
</html>
